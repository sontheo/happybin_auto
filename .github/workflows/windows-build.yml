name: Build Windows distribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies and Chromium
        shell: pwsh
        run: |
          python -m pip install 'playwright==1.64.0' 'pyinstaller==6.19.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PLAYWRIGHT_BROWSERS_PATH = '0'
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build executable
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = '0'
          python -m PyInstaller --noconfirm --clean --onedir --console --name HappybinAuto main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify packaged application and Chromium
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = '0'
          & .\dist\HappybinAuto\HappybinAuto.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\HappybinAuto\HappybinAuto.exe --check-browser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package distribution
        shell: pwsh
        run: |
          Copy-Item README.md, README.en.md, LICENSE dist\HappybinAuto\
          Compress-Archive -Path dist\HappybinAuto -DestinationPath HappybinAuto-windows-x64.zip
          Get-FileHash -Algorithm SHA256 HappybinAuto-windows-x64.zip | ForEach-Object { "$($_.Hash.ToLower())  HappybinAuto-windows-x64.zip" } | Set-Content -Encoding ascii SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HappybinAuto-windows-x64
          path: |
            HappybinAuto-windows-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
