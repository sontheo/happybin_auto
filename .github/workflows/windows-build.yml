name: Build Windows distribution

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies and Chromium
        shell: pwsh
        run: |
          python -m pip install 'playwright==1.64.0' 'pyinstaller==6.19.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PLAYWRIGHT_BROWSERS_PATH = '0'
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Embed release version
        if: github.event_name == 'release'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v?\d+\.\d+\.\d+$') { throw "Release tag must be x.y.z or vx.y.z" }
          Set-Content -Path app_version.py -Value "VERSION = `"$env:RELEASE_TAG`"" -Encoding utf8
      - name: Run unit and UI tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build executable
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = '0'
          python -m PyInstaller --noconfirm --clean --onedir --console --manifest windows/app.manifest --add-data "assets/fonts;assets/fonts" --name HappybinAuto main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify packaged application and Chromium
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = '0'
          & .\dist\HappybinAuto\HappybinAuto.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\HappybinAuto\HappybinAuto.exe --check-browser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package distribution
        shell: pwsh
        run: |
          Copy-Item README.md, README.en.md, LICENSE dist\HappybinAuto\
          Compress-Archive -Path dist\HappybinAuto -DestinationPath HappybinAuto-windows-x64.zip
      - name: Verify update archive layout
        shell: pwsh
        run: |
          @'
          from zipfile import ZipFile
          with ZipFile("HappybinAuto-windows-x64.zip") as archive:
              names = set(archive.namelist())
              required = {"HappybinAuto/HappybinAuto.exe", "HappybinAuto/_internal/assets/fonts/Pretendard-Regular.otf", "HappybinAuto/_internal/assets/fonts/Pretendard-Bold.otf"}
              missing = required - names
              if missing:
                  raise SystemExit(f"Missing distribution files: {sorted(missing)}")
              if any(chr(92) in name or name.startswith("/") or ".." in name.split("/") for name in names):
                  raise SystemExit("Archive contains unsupported paths")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: HappybinAuto-windows-x64
          path: |
            HappybinAuto-windows-x64.zip
          if-no-files-found: error
          retention-days: 7
      - name: Attach ZIP to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$env:RELEASE_TAG" HappybinAuto-windows-x64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
